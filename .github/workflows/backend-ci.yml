name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx pydantic pydantic-settings fastapi uvicorn sqlalchemy alembic argon2-cffi pyjwt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check Formatting with Ruff
        run: |
          ruff format --check .

      - name: Run Pytest
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-1234567890-test-secret-key
          JWT_SECRET: test-jwt-secret
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest
